# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parameter names and javadoc for decompiled Minecraft: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.264
loader_version_range=[1,)

## Mod Properties
mod_id=buildcraftreborn
mod_name=BuildCraft Reborn
mod_license=MPL-2.0 and MMPL-1.0.1 (see LICENSE, LICENSE-API and LICENSE-ASSETS)
mod_version=1.3.0
mod_group_id=buildcraftreborn
mod_authors=Gwen
mod_description=BuildCraft for Minecraft 1.21.1 NeoForge: engines, pipes, quarries, oil refining, blueprints and the robots from BuildCraft 7.1. This is an unofficial port: BuildCraft is by SpaceToad and the BuildCraft Team, who aren't involved, so please report problems on GitHub rather than to them.
# The project page; the mods list links to it and its issue tracker
mod_url=https://github.com/Reiko45/BuildCraft-Reborn
# NeoForge's update checker reads this (update.json at the top of the repository)
mod_update_json=https://raw.githubusercontent.com/Reiko45/BuildCraft-Reborn/main/update.json

## Optional integrations (compile-time APIs; see build.gradle)
jei_version=19.57.0.451
jade_version=15.10.6+neoforge
top_version=1.21_neo-12.0.8-10
crafttweaker_version=21.0.39
emi_version=1.1.24+1.21.1+neoforge
# true: also run JEI, Jade, The One Probe and CraftTweaker in the dev client, server and GameTest runs
compat_runtime=true
# The recipe viewer those runs load: jei, emi or both (EMI shows JEI's plugins too, but skips ours since we have
# our own EMI plugin)
recipe_viewer=jei
# PneumaticCraft (Modrinth version id of 8.2.23 for 1.21.1), only loaded with -Pinterop_runtime=true
pnc_version=TNzeuLH3
